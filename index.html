    @font-face {
      font-family: 'Unbounded';
      src: url('assets/unbounded.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --font-main: 'Unbounded', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --theme-color: #404040;
      --accent-color: #F97316;
      --text-main: #FFFFFF;
      --text-muted: #A8A29E;
      --card-bg: rgba(28, 12, 16, 0.42);
      --card-border: rgba(140, 125, 125, 0.28);
      --card-blur: 24px;
      --card-radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      user-select: none;
    }

    /* Background Video Container */
    .bg-video-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(2px) brightness(0.8);
      transform: scale(1.04);
      transition: filter 0.8s ease;
    }

    .bg-tint {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.75) 100%);
    }

    /* Subtle Scanlines / Noise Overlay */
    .noise-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0.04;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.15) 0px, transparent 1px, transparent 2px);
    }

    /* Click to Enter Overlay Screen */
    #reveal-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      cursor: pointer;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
    }

    #reveal-screen.faded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .reveal-text {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #FFFFFF;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      animation: pulseText 2s ease-in-out infinite alternate;
      padding: 16px 24px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }

    @keyframes pulseText {
      0% {
        opacity: 0.65;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /* Floating Sound Control Button */
    .sound-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 60;
      background: rgba(18, 18, 22, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      width: 44px;
      height: 44px;
      color: #FFFFFF;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .sound-btn:hover {
      background: rgba(30, 30, 38, 0.9);
      border-color: var(--accent-color);
      transform: scale(1.08);
    }

    .sound-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Main Container & Profile Card */
    .main-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .profile-card {
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      backdrop-filter: blur(var(--card-blur));
      -webkit-backdrop-filter: blur(var(--card-blur));
      border: 1.5px solid var(--card-border);
      border-radius: var(--card-radius);
      padding: 32px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 35px rgba(255, 255, 255, 0.03);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .profile-card.active {
      opacity: 1;
      transform: translateY(0);
    }

    /* Card Top Header: Avatar + Nick + Badges */
    .card-top {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      display: block;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .username {
      font-size: 1.65rem;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
      position: relative;
      display: inline-block;
      background-image: url('assets/sparkles.gif');
      background-size: cover;
      background-position: center;
      width: fit-content;
    }

    .badges-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-invited {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 500;
      color: #E2E8F0;
      transition: all 0.2s ease;
    }

    .badge-invited:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .badge-invited svg {
      width: 12px;
      height: 12px;
      fill: var(--accent-color);
    }

    .badge-tag {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(249, 115, 22, 0.6);
      color: var(--accent-color);
      border-radius: 9999px;
      padding: 2px 10px;
      font-size: 0.72rem;
      font-weight: 500;
      background: rgba(249, 115, 22, 0.06);
    }

    /* Location Row */
    .location-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .location-row svg {
      width: 14px;
      height: 14px;
      fill: var(--accent-color);
    }

    /* Gradient Divider */
    .divider {
      height: 1px;
      width: 100%;
      background: linear-gradient(90deg, transparent 0%, rgba(249, 115, 22, 0.35) 50%, transparent 100%);
      margin: 18px 0;

    /* Cross Symbol */

      text-align: center;
      font-size: 1.8rem;
      font-weight: 400;
      color: #FFFFFF;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);

    /* Bio / Quote Specs */

      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.86rem;
      line-height: 1.65;
      color: #D1D5DB;
      font-family: var(--font-main);
      white-space: pre-line;
      margin-bottom: 18px;

    .bio-content .spec-title {
      font-weight: 600;
      color: #FFFFFF;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      font-style: italic;
      color: #71717A;
      margin-top: 6px;
    }

    /* Social Links Grid */
    .social-links {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(249, 115, 22, 0.2);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--accent-color);
      transition: transform 0.2s ease;
    }

    .social-btn:hover svg {
      transform: scale(1.1);
    }

    /* Discord Mini-Card */
    .discord-card {
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
    }

    .discord-avatar-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    }

    .discord-avatar {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.08);
      display: block;
    }

    .status-indicator {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 2.5px solid #141416;
      background-color: #747f8d; /* default offline */
    }

    .status-indicator.online { background-color: #23a55a; }
    .status-indicator.idle { background-color: #f0b232; }
    .status-indicator.dnd { background-color: #f23f43; }

    .discord-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .discord-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: #FFFFFF;
      truncate: true;
    }

    .discord-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 480px) {
      .profile-card {
        padding: 24px 20px;
      }
      .card-top {
        gap: 16px;
      }
      .avatar-wrapper {
        width: 74px;
        height: 74px;
      }
      .username {
        font-size: 1.35rem;
      }
      .social-btn {
        padding: 8px 14px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>

            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"></path>
          </svg>
          <span>Spotify</span>
        </a>
      </div>

      <!-- Discord Presence Card -->
      <div class="discord-card">
        <div class="discord-avatar-wrap">
          <img id="discord-avatar" src="assets/avatar.webp" alt="Discord" class="discord-avatar">
          <div id="discord-status-dot" class="status-indicator"></div>
        </div>
        <div class="discord-info">
          <div id="discord-username" class="discord-name">Yoshi</div>
          <div id="discord-activity" class="discord-status">Offline</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const revealScreen = document.getElementById('reveal-screen');
    const profileCard = document.getElementById('profile-card');
    const bgVideo = document.getElementById('bg-video');
    const soundBtn = document.getElementById('sound-btn');
    const iconSoundOn = document.getElementById('icon-sound-on');
    const iconSoundOff = document.getElementById('icon-sound-off');

    function updateSoundUI(isMuted) {
      if (isMuted) {
        iconSoundOn.style.display = 'none';
        iconSoundOff.style.display = 'block';
      } else {
        iconSoundOn.style.display = 'block';
        iconSoundOff.style.display = 'none';
      }
    }

    
    if (window.location.search.includes('enter') || window.location.hash === '#enter') {
      revealScreen.classList.add('faded');
      profileCard.classList.add('active');
    }

    // Start experience on reveal click
    revealScreen.addEventListener('click', () => {
      revealScreen.classList.add('faded');
      profileCard.classList.add('active');

      if (bgVideo) {
        bgVideo.muted = false;
        bgVideo.volume = 0.6;
        bgVideo.play().then(() => {
          updateSoundUI(false);
        }).catch(() => {
          bgVideo.muted = true;
          bgVideo.play();
          updateSoundUI(true);
        });
      }

      startTitleTyping();
    });

    // Sound toggle
    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!bgVideo) return;
      if (bgVideo.muted) {
        bgVideo.muted = false;
        bgVideo.volume = 0.6;
        bgVideo.play();
        updateSoundUI(false);
      } else {
        bgVideo.muted = true;
        updateSoundUI(true);
      }
    });

    // Typing Title Animation
    function startTitleTyping() {
      const titleText = "Yoshi";
      let index = 0;
      let deleting = false;
      
      setInterval(() => {
        if (!deleting) {
          document.title = titleText.substring(0, index + 1);
          index++;
          if (index === titleText.length) {
            setTimeout(() => { deleting = true; }, 1600);
          }
        } else {
          document.title = titleText.substring(0, index - 1);
          index--;
          if (index === 0) {
            deleting = false;
          }
        }
      }, 250);
    }

    // Discord Lanyard Integration
    async function loadDiscordStatus() {
      const discordId = "677098375576944640";
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${discordId}`);
        const data = await res.json();
        if (data.success && data.data) {
          const u = data.data;
          const statusDot = document.getElementById('discord-status-dot');
          const nameEl = document.getElementById('discord-username');
          const actEl = document.getElementById('discord-activity');
          const avatarEl = document.getElementById('discord-avatar');

          if (u.discord_user.avatar) {
            avatarEl.src = `https://cdn.discordapp.com/avatars/${discordId}/${u.discord_user.avatar}.webp?size=128`;
          }

          nameEl.textContent = u.discord_user.global_name || u.discord_user.username;
          statusDot.className = 'status-indicator ' + (u.discord_status || 'offline');

          if (u.spotify) {
            actEl.textContent = `🎵 ${u.spotify.song} — ${u.spotify.artist}`;
          } else if (u.activities && u.activities.length > 0) {
            const act = u.activities.find(a => a.type === 0) || u.activities[0];
            actEl.textContent = `Playing ${act.name}`;
          } else {
            actEl.textContent = u.discord_status === 'offline' ? 'Offline' : 'Online';
          }
        }
      } catch (err) {
        console.log('Discord lanyard error:', err);
      }
    }
    loadDiscordStatus();
  </script>
</body>
</html>
